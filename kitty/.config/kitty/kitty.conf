# Appearance translated from alacritty/.config/alacritty/alacritty.toml.
include catppuccin_mocha.conf
font_family MesloLGS Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 15.0

# Kitty uses points: 7.5pt approximates Alacritty's 10px at 96 DPI.
window_padding_width 7.5
hide_window_decorations titlebar-only
background_opacity 0.6
cursor_shape block
cursor_blink_interval 0.5
macos_option_as_alt both

# Keep Kitty's xterm-kitty TERM and its shell integration defaults.
# Linux blur is controlled by the compositor, not a Kitty setting.
# A missing local file is allowed; keep machine overrides outside the repo.
globinclude local.conf
