[general]
import = [
	"~/.config/alacritty/catppuccin_mocha.toml",
]

[env]
TERM = "xterm-256color"
COLORTERM = "true"

[window]
padding.x = 10
padding.y = 10

decorations = "Buttonless"

opacity = 0.6
blur = true

option_as_alt = "Both"

[font]
normal.family = "MesloLGS Nerd Font Mono"

size = 15

[cursor]
style = { shape = "Block", blinking = "On"}

